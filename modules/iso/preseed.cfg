# =============================================================================
# iso/preseed.cfg — Debian/Ubuntu Automated Installation Preseed File
# =============================================================================
# This file answers all interactive prompts during a Debian/Ubuntu install,
# enabling fully unattended (hands-free) system installation.
#
# REFERENCE:
#   https://www.debian.org/releases/stable/amd64/apbs04.html
#   https://help.ubuntu.com/community/InstallCDCustomization
#
# HOW TO USE:
#   This file is injected into the ISO by iso/build.sh automatically.
#   Edit values below to match your desired installation settings.
# =============================================================================

# --- Locale and keyboard ---
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# --- Network configuration ---
# Use DHCP by default during installation (static IP is set post-install by network/setup.sh)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string ubuntu-server
d-i netcfg/get_domain string local

# --- Mirror (apt repository) ---
d-i mirror/country string manual
d-i mirror/http/hostname string archive.ubuntu.com
d-i mirror/http/directory string /ubuntu
d-i mirror/http/proxy string

# --- Clock and timezone ---
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Taipei

# --- Disk partitioning ---
# WARNING: This will erase the entire disk. Change sda to your target disk.
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- User account ---
# Change the password hash below. Generate with: openssl passwd -6 'yourpassword'
d-i passwd/user-fullname string Roger
d-i passwd/username string roger
d-i passwd/user-password-crypted password $6$rounds=656000$CHANGE_THIS_HASH
d-i passwd/root-login boolean false

# --- Package selection ---
tasksel tasksel/first multiselect server
d-i pkgsel/include string openssh-server curl git vim

# Disable automatic security updates during install (configure post-install)
d-i pkgsel/update-policy select none

# --- Boot loader ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# --- Post-install: clone dotfiles and run setup ---
# This runs after the base system is installed.
# Customize the git clone URL to point to your own dotfiles repository.
d-i preseed/late_command string \
  in-target bash -c ' \
    apt-get install -y git curl && \
    git clone https://github.com/YOUR_USERNAME/dotfiles.git /root/dotfiles && \
    bash /root/dotfiles/install.sh --all \
  '

# --- Finish ---
d-i finish-install/reboot_in_progress note
